<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>演算クライマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one tall graph-paper notebook column; the canvas is the page, HUD floats on top, the result card sits on the paper */
:root{
  --paper:#f6f9fc; --grid:#dbe7f1; --grid-strong:#b3cbe0; --ink:#1c2836; --ink-soft:#5b6b7d;
  --spike:#d2423a; --accent:#2361b8; --token:#ffffff; --veil:rgba(246,249,252,.80); --card:#ffffff;
  --hand:"Klee One","Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1d2a25; --grid:#283832; --grid-strong:#3a4f46; --ink:#e8efe9; --ink-soft:#9fb3a8;
  --spike:#ff7d70; --accent:#ffd45c; --token:#22312b; --veil:rgba(29,42,37,.82); --card:#23332d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1d2a25; --grid:#283832; --grid-strong:#3a4f46; --ink:#e8efe9; --ink-soft:#9fb3a8;
  --spike:#ff7d70; --accent:#ffd45c; --token:#22312b; --veil:rgba(29,42,37,.82); --card:#23332d; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;
  border-inline:1.5px solid var(--grid-strong);background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.stat{display:flex;flex-direction:column;gap:2px}
.hud>.stat{background:var(--card);border:1.5px solid var(--ink);border-radius:4px;padding:6px 10px}
.hud>.r{background:none;border:0;padding:0}
.hud>.r>.box{display:flex;flex-direction:column;align-items:flex-end;gap:2px;background:var(--card);border:1.5px solid var(--ink);border-radius:4px;padding:6px 10px}
.stat.r{align-items:flex-end}
.lab{font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
.pts{font-family:var(--mono);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;transition:color .2s}
.pts.up{color:var(--accent)} .pts.down{color:var(--spike)}
.hgt{font-family:var(--mono);font-weight:600;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.sub{font-family:var(--mono);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sub.rk{color:var(--accent);font-weight:600}
.hbtns{display:flex;gap:6px;margin-top:6px;pointer-events:auto}
.snd{pointer-events:auto;width:36px;height:36px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:4px;
  background:var(--card);color:var(--ink);cursor:pointer;padding:0}
.snd svg{width:20px;height:20px}
.snd .x{display:none}
.snd[aria-pressed="false"] .x{display:inline}
.snd[aria-pressed="false"] .w{display:none}

.screen{position:absolute;inset:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;background:var(--veil);
  padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen>.col{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;margin-block:auto}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:4px;padding:16px 16px 14px;box-shadow:4px 4px 0 var(--grid-strong)}
.over h1{font-family:var(--hand);font-weight:600;font-size:34px;margin:0}
.result{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:8px}
.big{font-family:var(--mono);font-weight:600;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;margin-left:4px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;font-family:var(--hand);font-weight:600;border-radius:4px}
button.go{font-size:22px;padding:12px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper)}
button.go:active,button.sub-btn:active{transform:translateY(1px)}
button.sub-btn{font-size:18px;padding:12px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink)}
.row{display:flex;gap:10px}.row>.sub-btn{flex:1}.row>.go{flex:1.6}

/* ranking */
.rank-msg{font-family:var(--hand);font-weight:600;font-size:16px;color:var(--accent);margin-top:12px;min-height:1.3em}
.lead{font-size:13px;line-height:1.7;color:var(--ink-soft);margin:8px 0 14px}
.name-in{width:100%;box-sizing:border-box;margin-top:4px;font:16px var(--body);padding:10px 12px;border:1.5px solid var(--ink);border-radius:4px;
  background:var(--paper);color:var(--ink);user-select:text;-webkit-user-select:text;outline:none}
.name-in:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.rk-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rk-head h2{font-family:var(--hand);font-weight:600;font-size:26px;margin:0;display:flex;align-items:center;gap:10px}
.live{width:9px;height:9px;border-radius:50%;background:var(--spike);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;padding:0;border:1.5px solid var(--ink);background:var(--card);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.mode{font-size:11px;color:var(--ink-soft);margin:6px 0 8px}
.rk-list{list-style:none;margin:0;padding:0;max-height:52vh;overflow-y:auto;border-top:1.5px solid var(--ink)}
.rk-list li{display:grid;grid-template-columns:34px 1fr auto;align-items:baseline;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--grid-strong)}
.rk-list .pos{font-family:var(--mono);font-weight:600;color:var(--ink-soft);text-align:center}
.rk-list li.top .pos{font-size:17px}
.rk-list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rk-list .sc{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.rk-list li.me{background:color-mix(in srgb,var(--accent) 13%,transparent)}
.you{font-size:10px;border:1px solid var(--accent);color:var(--accent);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:2px}
.empty{color:var(--ink-soft);text-align:center;padding:18px 0;font-size:13px;line-height:1.7}
.me-line{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-top:10px}
.me-line b{color:var(--ink)}
.link{background:none;border:0;color:var(--accent);font-family:var(--body);font-weight:700;font-size:13px;padding:4px;text-decoration:underline}
.upd{font-size:11px;color:var(--ink-soft);text-align:right;margin-top:6px;font-family:var(--mono)}
.rk-list li.gap{display:block;text-align:center;color:var(--ink-soft);padding:0;border-bottom:0;line-height:1.2}

/* 常設ランキング：ゲーム列の左の空きスペースに表示（画面が広いときだけ） */
.side{display:none}
@media (min-width:1080px){
  .side{display:flex;flex-direction:column;position:fixed;top:16px;width:250px;box-sizing:border-box;
    max-height:calc(100vh - 32px);left:calc(50% - 260px - 28px - 250px);z-index:1}
  .side .rk-head h2{font-size:22px}
  .side .rk-list{max-height:none;flex:1;min-height:0}
  .side .rk-list li{padding:4px 2px;font-size:13px}
  .side .rk-list li.top .pos{font-size:15px}
  #rankBtn{display:none}
}
</style>

<div id="app">

<aside class="card side" id="side" aria-label="ランキング">

<script>
/* ============================================================
   リアルタイムランキング（Firebase Realtime Database）
   NUMBER 1024 と同じ Firebase プロジェクトを使い、
   別のノード「climber_leaderboard」にスコア（到達した高さ m）を保存します。
   Firebase に繋がらない環境では、この端末内だけのローカルランキングになります。

   ★ Realtime Database の「ルール」に climber_leaderboard を追加してください：
   {
     "rules": {
       "leaderboard": { ...（NUMBER 1024 の既存ルールはそのまま）... },
       "climber_leaderboard": {
         ".read": true,
         "$playerId": {
           ".write": true,
           ".validate": "newData.hasChildren(['name','score','date']) && newData.child('score').isNumber() && newData.child('name').isString() && newData.child('name').val().length <= 10"
         }
       }
     }
   }
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAqjYy2AAsMbwAQ6TtNCWjj1KzcN1sUUFo",
  authDomain: "number-1024.firebaseapp.com",
  databaseURL: "https://number-1024-default-rtdb.firebaseio.com",
  projectId: "number-1024"
};

(function(){
const $=s=>document.querySelector(s);
const app=$('#app'), cv=$('#cv'), ctx=cv.getContext('2d'), overScr=$('#overScr'), rankScr=$('#rankScr'), nameScr=$('#nameScr');
const M=20, G=1500, JV=560, VX=210, MAXFALL=760, PR=9, TR=16;
let W=0,H=0,DPR=1,col={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function readColors(){const cs=getComputedStyle(document.documentElement);
  ['paper','grid','grid-strong','ink','ink-soft','spike','accent','token'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// ---------- BGM (Web Audio, generated in the page) ----------
const Music=(()=>{
  let ac=null,master=null,mus=null,timer=null,step=0,nextT=0,playing=false,bpm=132,tr=0;
  const KEYS=[0,2,3,5,7,8];
  let on=store.get('mc_bgm')!=='off';
  const CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]]; // C Am F G
  const PA=[3,null,2,null,1,null,2,null,3,null,2,1,0,null,1,null];
  const PB=[0,null,1,2,3,null,2,null,1,null,2,null,3,null,null,null];
  const hz=m=>440*Math.pow(2,(m-69)/12);
  let noiseBuf=null;
  function ensure(){if(ac)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    ac=new AC();master=ac.createGain();master.gain.value=on?.22:0;master.connect(ac.destination);
    mus=ac.createGain();mus.gain.value=0;mus.connect(master);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return true}
  function tone(type,f,t,dur,vol,dest,fEnd){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(fEnd)o.frequency.exponentialRampToValueAtTime(fEnd,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g);g.connect(dest||mus);o.start(t);o.stop(t+dur+.02)}
  function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
    g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(mus);o.start(t);o.stop(t+.18)}
  function hat(t){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=7000;
    g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(g);g.connect(mus);s.start(t);s.stop(t+.06)}
  function play(i,t){const bar=Math.floor(i/16)%8,s=i%16,ch=CH[bar%4].map(m=>m+tr),tones=[ch[0],ch[1],ch[2],ch[0]+12],pat=bar<4?PA:PB,sd=60/bpm/4;
    const n=pat[s];if(n!==null)tone('square',hz(tones[n]+12),t,sd*1.8,.07);
    if(s%4===0)tone('triangle',hz(ch[0]-12),t,sd*1.6,.32);else if(s%4===2)tone('triangle',hz(ch[0]),t,sd*1.2,.2);
    if(s%8===0)kick(t);if(s%4===2)hat(t)}
  function tick(){while(nextT<ac.currentTime+.12){play(step,nextT);nextT+=60/bpm/4;step++}}
  return{
    start(){if(!ensure())return;if(ac.state==='suspended')ac.resume();if(playing)return;playing=true;step=0;nextT=ac.currentTime+.06;
      mus.gain.cancelScheduledValues(ac.currentTime);mus.gain.setValueAtTime(1,ac.currentTime);timer=setInterval(tick,25);tick()},
    stop(){if(!playing)return;playing=false;clearInterval(timer);mus.gain.setTargetAtTime(0,ac.currentTime,.06)},
    // game-over: a slow A-minor lament over a descending bass, ending on a long trembling minor chord
    over(){if(!ensure())return;if(ac.state==='suspended')ac.resume();const t=ac.currentTime+.1,B=.42;
      const soft=(m,st,dur,vol,type,vib)=>{const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
        o.type=type;o.frequency.value=hz(m);f.type='lowpass';f.frequency.value=1800;
        if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5;lg.gain.setValueAtTime(0,st);lg.gain.linearRampToValueAtTime(hz(m)*.012,st+.6);l.connect(lg);lg.connect(o.frequency);l.start(st);l.stop(st+dur+.05)}
        g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(vol,st+.05);g.gain.setValueAtTime(vol,st+dur*.35);g.gain.exponentialRampToValueAtTime(.0008,st+dur);
        o.connect(f);f.connect(g);g.connect(master);o.start(st);o.stop(st+dur+.05)};
      [76,74,72,71].forEach((m,i)=>soft(m,t+i*B,B*1.15,.16,'triangle'));
      [57,55,53,52].forEach((m,i)=>soft(m-12,t+i*B,B*1.1,.22,'sine'));
      const e=t+4*B;
      soft(69,e,2.4,.17,'triangle',true);soft(64,e,2.4,.07,'sine');soft(60,e,2.4,.07,'sine');soft(45,e,2.4,.22,'sine')},
    key(k){tr=KEYS[k%KEYS.length]},
    tempo(h){bpm=132+Math.min(40,h/15)},
    toggle(){on=!on;store.set('mc_bgm',on?'on':'off');if(ac)master.gain.setTargetAtTime(on?.22:0,ac.currentTime,.05);return on},
    get on(){return on},
    pause(){if(ac&&ac.state==='running')ac.suspend()},resume(){if(ac&&playing)ac.resume()}
  }})();
const sndBtn=$('#snd');sndBtn.setAttribute('aria-pressed',Music.on);
sndBtn.addEventListener('pointerdown',e=>e.stopPropagation());
sndBtn.addEventListener('click',e=>{e.stopPropagation();sndBtn.setAttribute('aria-pressed',Music.toggle());sndBtn.blur()});
document.addEventListener('visibilitychange',()=>document.hidden?Music.pause():(paused?0:Music.resume()));

// ---------- game ----------
let state='ready',player,objs,pops,trail,camY,genY,points,maxH,dir,inv,shake,time=0,trailT=0,curArea=0,banner=null,paused=false;
function resize(){const r=app.getBoundingClientRect();const oldW=W;W=r.width;H=r.height;DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  if(oldW&&player){player.x*=W/oldW;trail.forEach(p=>p.x*=W/oldW)}}
addEventListener('resize',resize);

const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1));
const r5=n=>Math.max(5,Math.round(n/5)*5);
function pickW(list){let t=list.reduce((s,x)=>s+x[0],0),r=Math.random()*t;for(const [w,f] of list){if((r-=w)<0)return f}return list[0][1]}
function makeOp(h){const d=h/100;
  if(Math.random()<Math.max(.36,.66-.035*d)){
    const o=[[4,()=>({op:'+',n:r5(ri(5,20+12*d))})],[2,()=>({op:'×',n:2})]];

function update(dt){
  time+=dt;
  if(state==='play'){
    const p=player;
    p.vy=Math.max(-MAXFALL,p.vy-G*dt);p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.x<PR){p.x=PR;p.vx=Math.abs(p.vx)}if(p.x>W-PR){p.x=W-PR;p.vx=-Math.abs(p.vx)}

    const ka=areaOf(maxH*M);if(ka>curArea){curArea=ka;Music.key(ka)}
    if(inv>0)inv-=dt;
    for(const o of objs){
      if(o.k==='op'){if(o.taken)continue;const dx=o.fx*W-p.x,dy=o.y-p.y;
        if(dx*dx+dy*dy<(PR+TR-2)**2){o.taken=true;const b=points;points=applyOp(points,o);
          pop(`${fmt(b)} ${o.op} ${o.n} = ${fmt(points)}`,o.fx*W,o.y,points<b);hudPts(points-b)}}
      else if(inv<=0){const cx=spikeX(o),hx=o.w/2-3,hy=7;
        const nx=Math.max(cx-hx,Math.min(p.x,cx+hx)),ny=Math.max(o.y-hy,Math.min(p.y,o.y+hy));
        if((p.x-nx)**2+(p.y-ny)**2<(PR-1)**2){const b=points;points=Math.floor(points/2);inv=1;shake=.3;

      if(points<=0)break;

    if(points<=0)gameOver();

  if(flashT>0){flashT-=dt;if(flashT<=0)ptsEl.className='pts'}

  if(h!==lastH){hgtEl.textContent=h+' m';lastH=h}
  if(r!==lastRun){runEl.textContent='最高 '+r+' m';lastRun=r;updateHudRank();if(state==='play')queueLive()}
}

function drawBackground(){

function hasCloud(){return !!(window.storage&&typeof window.storage.get==='function'&&typeof window.storage.set==='function')}

async function initRanking(){
  if(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL){
    try{
      await loadScript('https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js');
      if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
      fbRef=firebase.database().ref(LB_PATH);rkMode='firebase';
      fbRef.on('value',snap=>{const v=snap.val()||{};board=Object.keys(v).map(k=>({id:k,...v[k]})).filter(e=>typeof e.score==='number');
        lastSync=new Date();renderRanking()},
        err=>{console.warn('[ranking] firebase read failed:',err&&err.message);rkModeEl.textContent='⚠ ランキングを読み込めません（Firebase のルールを確認してください）'});
      renderRanking();if(playerName)submit();return;
    }catch(e){console.warn('[ranking] Firebase init failed, falling back:',e&&e.message||e)}
  }
  rkMode=hasCloud()?'cloud':hasLS()?'local':'off';
  if(rkMode==='local'){
    try{chan=new BroadcastChannel('mc_ranking');chan.onmessage=refresh}catch(e){}
    addEventListener('storage',e=>{if(e.key===LOCAL_LB)refresh()});
  }
  if(rkMode!=='off')setInterval(refresh,4000);
  await refresh();if(playerName)submit();
}
async function loadList(){
  try{
    if(rkMode==='cloud'){const r=await window.storage.get(LB_PATH,true);return r&&r.value?JSON.parse(r.value):[]}
    if(rkMode==='local')return JSON.parse(localStorage.getItem(LOCAL_LB)||'[]');
  }catch(e){console.warn('[ranking] load failed:',e&&e.message||e)}
  return [];
}
async function saveList(list){
  try{
    if(rkMode==='cloud'){await window.storage.set(LB_PATH,JSON.stringify(list),true);return true}
    if(rkMode==='local'){localStorage.setItem(LOCAL_LB,JSON.stringify(list));if(chan)chan.postMessage('u');return true}
  }catch(e){console.error('[ranking] save failed:',e&&e.message||e)}
  return false;
}
async function refresh(){if(rkMode==='firebase'||rkMode==='off'){renderRanking();return}board=await loadList();lastSync=new Date();renderRanking()}

// 自分の記録（自己ベスト）を書き込み、順位（0始まり）を返す。失敗時 null
async function submit(){
  if(!playerName||rkMode==='off')return null;
  const cur=myBest();
  if(rkMode==='firebase'){
    try{
      const r=await fbRef.child(playerId).transaction(prev=>{
        const s=Math.max(cur,prev&&typeof prev.score==='number'?prev.score:0);
        if(!prev&&s<=0)return;                        // 0 m のままなら登録しない
        if(prev&&prev.score===s&&prev.name===playerName)return; // 変化なし
        return{name:playerName,score:s,date:Date.now()}});
      const v=r.snapshot&&r.snapshot.val();
      if(v){const i=board.findIndex(e=>e.id===playerId),e={id:playerId,...v};i>=0?board[i]=e:board.push(e);renderRanking()}
    }catch(e){console.error('[ranking] firebase write failed:',e&&e.message||e);return null}
  }else{
    const list=await loadList(),i=list.findIndex(e=>e.id===playerId),prev=i>=0?list[i]:null;
    const s=Math.max(cur,prev?prev.score:0);
    if(prev||s>0){
      const e={id:playerId,name:playerName,score:s,date:prev&&prev.score===s?prev.date:Date.now()};
      i>=0?list[i]=e:list.push(e);
      list.sort((a,b)=>b.score-a.score);
      if(!await saveList(list.slice(0,LB_KEEP)))return null;
      board=list.slice(0,LB_KEEP);lastSync=new Date();renderRanking();
    }
  }
  return sorted().findIndex(e=>e.id===playerId);
}
function queueLive(){if(!playerName||rkMode==='off'||liveT)return;liveT=setTimeout(()=>{liveT=null;submit()},1500)}

// プレイ中の暫定順位（他プレイヤーの記録と今の到達高さを比較）
function updateHudRank(){
  if(rkMode==='off'||!playerName){rkHud.textContent='';return}
  const own=board.find(e=>e.id===playerId),h=Math.max(Math.floor(maxH||0),own?own.score:0);
  if(h<=0&&!own){rkHud.textContent=board.length?'順位 —':'';return}
  let n=1;for(const e of board)if(e.id!==playerId&&e.score>h)n++;
  rkHud.textContent='順位 '+n+' 位';
}
const sideList=$('#sideList'), sideMode=$('#sideMode'), sideUpd=$('#sideUpd'), sideName=$('#sideName');
function renderRanking(){
  meName.textContent=sideName.textContent=playerName||'—';
  rkModeEl.textContent=sideMode.textContent=rkMode==='firebase'?'🌐 全プレイヤーとリアルタイム共有中'
    :rkMode==='cloud'?'☁ オンライン共有中'
    :rkMode==='local'?'💻 この端末内のみ（Firebase に接続できませんでした）'
    :'⚠ この環境ではランキングを利用できません';
  if(rkMode==='off'){rkList.innerHTML=sideList.innerHTML='<li class="empty" style="display:block">ブラウザのストレージがブロックされています</li>';rkUpd.textContent=sideUpd.textContent='';updateHudRank();return}
  const all=sorted(), list=all.slice(0,LB_SHOW), myPos=all.findIndex(e=>e.id===playerId);
  const row=(e,i)=>{const me=e.id===playerId;
    return `<li class="${i<3?'top':''}${me?' me':''}"><span class="pos">${['🥇','🥈','🥉'][i]||i+1}</span><span class="nm">${esc(e.name)}${me?'<span class="you">YOU</span>':''}</span><span class="sc">${fmt(e.score)} m</span></li>`};
  let html=list.length?list.map(row).join(''):'<li class="empty" style="display:block">まだ記録がありません<br>最初のランカーになろう！</li>';
  if(myPos>=LB_SHOW)html+='<li class="gap" aria-hidden="true">⋮</li>'+row(all[myPos],myPos); // 圏外でも自分の順位は表示
  rkList.innerHTML=sideList.innerHTML=html;
  rkUpd.textContent=sideUpd.textContent=lastSync?'更新 '+lastSync.toLocaleTimeString('ja-JP'):'';
  updateHudRank();
}

// ---------- screens ----------
let pausedByRank=false;
function openRank(){if(state==='play'&&!paused){paused=true;pausedByRank=true;Music.pause()}renderRanking();rankScr.hidden=false;rankScr.scrollTop=0;$('#rankClose').focus()}
function closeRank(){rankScr.hidden=true;if(pausedByRank){pausedByRank=false;paused=false;last=performance.now();Music.resume()}}
function openName(cancelable){$('#nameIn').value=playerName;$('#nameCancel').hidden=!cancelable;nameScr.hidden=false;setTimeout(()=>$('#nameIn').focus(),50)}
function confirmName(){const n=($('#nameIn').value.trim()||'プレイヤー').slice(0,10);playerName=n;store.set('mc_name',n);nameScr.hidden=true;$('#nameIn').blur();renderRanking();submit()}
const rankBtn=$('#rankBtn');
rankBtn.addEventListener('pointerdown',e=>e.stopPropagation());
rankBtn.addEventListener('click',e=>{e.stopPropagation();rankBtn.blur();openRank()});
$('#overRank').addEventListener('click',openRank);
$('#rankClose').addEventListener('click',closeRank);
$('#nameEdit').addEventListener('click',()=>openName(true));
$('#sideEdit').addEventListener('click',e=>{e.currentTarget.blur();openName(true)});
$('#nameOk').addEventListener('click',confirmName);
$('#nameCancel').addEventListener('click',()=>{nameScr.hidden=true});
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();confirmName()}});

function retry(){reset();state='ready';overScr.hidden=true;rankMsg.textContent=''}
$('#retryBtn').addEventListener('click',retry);
function gameOver(){state='over';Music.stop();Music.over();const s=Math.floor(maxH);
  const pb=Math.max(s,+(store.get('mc_best')||0));store.set('mc_best',String(pb));
  $('#final').textContent=fmt(s);$('#pb').textContent=fmt(pb)+' m';
  if(liveT){clearTimeout(liveT);liveT=null}
  rankMsg.textContent=rkMode==='off'?'':'ランキングに反映中…';
  submit().then(pos=>{
    if(rkMode==='off'){rankMsg.textContent='';return}
    if(pos===null){rankMsg.textContent='⚠ ランキングに反映できませんでした';return}
    if(pos<0){rankMsg.textContent='0 m の記録はランキングに載りません';return}
    rankMsg.textContent=`${['🥇 ','🥈 ','🥉 '][pos]||''}ランキング ${pos+1} 位（全${board.length}人中）`;
  });
  setTimeout(()=>{if(state==='over'){overScr.hidden=false;overScr.scrollTop=0}},700)}

const anyScreen=()=>!rankScr.hidden||!nameScr.hidden;
app.addEventListener('pointerdown',e=>{if((state==='play'||state==='ready')&&!anyScreen()&&!e.target.closest('button,.screen')){e.preventDefault();tap()}});
addEventListener('keydown',e=>{
  if(e.target&&e.target.closest&&e.target.closest('input'))return;
  if(!rankScr.hidden){if(e.key==='Escape'){e.preventDefault();closeRank()}return}
  if(!nameScr.hidden)return;
  if((state==='play'||state==='ready')&&(e.code==='Space'||e.code==='ArrowUp')){e.preventDefault();tap()}
  else if(state==='over'&&!overScr.hidden&&e.key==='Enter'){e.preventDefault();retry()}});

resize();reset();
renderRanking();
if(!playerName)openName(false);
initRanking();
requestAnimationFrame(loop);
})();
</script>
